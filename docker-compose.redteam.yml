version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6380:6379"
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    build: .
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app:ro
      - ./tests/redteam_artifacts/uploads:/app/uploads
      - ./tests/redteam_artifacts/workspaces:/app/workspaces
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env.redteam
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A worker.celery_app worker --loglevel=info
    volumes:
      - .:/app:ro
      - ./tests/redteam_artifacts/uploads:/app/uploads
      - ./tests/redteam_artifacts/workspaces:/app/workspaces
      - ./tests/redteam_artifacts:/app/output
    env_file:
      - .env.redteam
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    depends_on:
      - redis

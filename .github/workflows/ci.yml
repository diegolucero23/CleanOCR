name: CI/CD Pipeline

"on":
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # secret-scan — fail the build if any commit contains key-shaped strings.
  # Backstop for the local pre-commit gitleaks hook (.pre-commit-config.yaml);
  # allowlist for mocks and the revoked-key history lives in .gitleaks.toml.
  # ---------------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  # ---------------------------------------------------------------------------
  # test — run the full pytest suite against a live Redis service
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GOOGLE_API_KEY: "test-key-for-ci"
      REDIS_URL: "redis://localhost:6379/0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # build — verify the Docker image builds cleanly (gated on passing tests)
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cleanocr:latest .

name: CI/CD Pipeline

"on":
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # test — run the full pytest suite against a live Redis service
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GOOGLE_API_KEY: "test-key-for-ci"
      REDIS_URL: "redis://localhost:6379/0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # build — verify the Docker image builds cleanly (gated on passing tests)
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cleanocr:latest .

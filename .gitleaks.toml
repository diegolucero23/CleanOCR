# Gitleaks configuration for CleanOCR.
# Used by the pre-commit hook (.pre-commit-config.yaml) and the CI
# secret-scan job (.github/workflows/ci.yml). See SECURITY.md.

title = "CleanOCR secret scanning"

[extend]
# Start from gitleaks' built-in ruleset (covers Google API keys `AIza...`,
# GCP service accounts, GitHub/Slack/Stripe tokens, private keys, etc.)
useDefault = true

[allowlist]
description = "Known non-secret placeholder/mock values used by CI and redteam mode"
regexes = [
  '''MOCK_KEY_DO_NOT_CHARGE''',
  '''test-key-for-ci''',
  '''mock_stripe''',
  '''mock_smtp''',
  '''your-gemini-api-key-here''',
]
paths = [
  # Audit report references the historical leak by fingerprint only.
  '''SECURITY_AUDIT\.md''',
  '''frontend/package-lock\.json''',
]
# The January 2026 leak of the OLD Gemini key (revoked 2026, see SECURITY.md
# and SECURITY_AUDIT.md finding #1). These commits are immutable history;
# allowlisting them keeps full-history scans green without weakening
# detection of any NEW key that might be committed.
commits = [
  "07548ef2f726c3f973dd4bf7dc1f33eab60e9a09",
  "dc79b5114890f279cf4de41768d802b254c0c180",
  "bd036d4a33f3e7d794abe32ecea555fa2f1eea28",
  "c72b6ba9139e29e440014edab8e6c1cbcc0fa3e6",
  "2d2467a0f4cdf59dc820392f6ed0de054f8accf2",
]

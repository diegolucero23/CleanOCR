version: '3.8'

services:
  # 1. The Message Broker
  # No published ports: web and worker reach it via the compose network
  # ("redis:6379"). Publishing it would expose an unauthenticated Redis —
  # and the Celery task queue — to the host/LAN.
  redis:
    image: redis:alpine

# 2. The Web Server (FastAPI)
  web:
    build: .
    command: uvicorn app.api.server:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      # Loopback-only: the API has no authentication, so it must not be
      # reachable from the network. Change to "8000:8000" only behind a
      # reverse proxy that adds auth.
      - "127.0.0.1:8000:8000"
    environment:
      - POPPLER_PATH=None
    # --- ADD THIS SECTION ---
    env_file:
      - .env
    # ------------------------
    depends_on:
      - redis

  # 3. The Background Worker (Celery)
  worker:
    build: .
    # This command starts the celery worker process
    command: celery -A app.workers.celery_worker.celery_app worker --loglevel=info
    volumes:
      - .:/app  # Maps the folder so it can see the uploaded PDF
    environment:
      - POPPLER_PATH=None
      - GOOGLE_API_KEY=${GOOGLE_API_KEY} # Passes key from your local .env
    env_file:
      - .env
    depends_on:
      - redis